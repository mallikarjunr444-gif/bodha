<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bodha-fav-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bodha-fav-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Scaled Emblem for 48x48 Favicon -->
  <g transform="translate(1, 1) scale(0.46)">
    <!-- Base Architectural Pillar -->
    <rect x="18" y="16" width="13" height="68" rx="6.5" fill="url(#bodha-fav-primary)" />

    <!-- Top Progression Tier -->
    <path
      d="M31 16 H 55 C 68.25 16 76 23.5 76 33.5 C 76 43 68.5 48.5 56 48.5 H 31 V 36 H 54 C 60 36 63.5 34.5 63.5 32 C 63.5 29.5 60 28 54 28 H 31 Z"
      fill="url(#bodha-fav-primary)"
    />

    <!-- Bottom Progression Tier -->
    <path
      d="M31 46 H 58 C 72 46 82 52.5 82 64 C 82 75.5 72.5 84 57 84 H 31 V 71.5 H 56 C 63.5 71.5 68.5 69.5 68.5 65 C 68.5 60.5 63.5 58.5 56 58.5 H 31 Z"
      fill="url(#bodha-fav-primary)"
    />

    <!-- Intersecting Upward Progression Chevron -->
    <path
      d="M48 48.5 L 58 38.5 L 67 48.5 L 57 58.5 Z"
      fill="url(#bodha-fav-accent)"
    />

    <!-- Intelligence Spark Core -->
    <circle cx="57.5" cy="48.5" r="4.5" fill="#ffffff" />
    <circle cx="57.5" cy="48.5" r="2.5" fill="#06b6d4" />
  </g>
</svg>