<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Brand Primary Gradient: Cobalt -> Indigo -> Cyan -->
    <linearGradient id="bodha-symbol-primary" x1="16%" y1="12%" x2="88%" y2="88%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Brand Accent Gradient: Cyan -> Emerald -->
    <linearGradient id="bodha-symbol-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Subtle Depth Shadow -->
    <filter id="bodha-symbol-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#bodha-symbol-glow)">
    <!-- Base Architectural Pillar (Foundation Spine) -->
    <rect x="18" y="16" width="13" height="68" rx="6.5" fill="url(#bodha-symbol-primary)" />

    <!-- Top Progression Tier (Milestone 1 / Prerequisite Baseline) -->
    <path
      d="M31 16 H 55 C 68.25 16 76 23.5 76 33.5 C 76 43 68.5 48.5 56 48.5 H 31 V 36 H 54 C 60 36 63.5 34.5 63.5 32 C 63.5 29.5 60 28 54 28 H 31 Z"
      fill="url(#bodha-symbol-primary)"
    />

    <!-- Bottom Progression Tier (Milestone 2 / Mastery Roadmap) -->
    <path
      d="M31 46 H 58 C 72 46 82 52.5 82 64 C 82 75.5 72.5 84 57 84 H 31 V 71.5 H 56 C 63.5 71.5 68.5 69.5 68.5 65 C 68.5 60.5 63.5 58.5 56 58.5 H 31 Z"
      fill="url(#bodha-symbol-primary)"
    />

    <!-- Intersecting Upward Progression Chevron / Dynamic Pathway Notch -->
    <path
      d="M48 48.5 L 58 38.5 L 67 48.5 L 57 58.5 Z"
      fill="url(#bodha-symbol-accent)"
      opacity="0.95"
    />

    <!-- Intelligence Core / AI Nexus Spark Node -->
    <circle cx="57.5" cy="48.5" r="4.5" fill="#ffffff" />
    <circle cx="57.5" cy="48.5" r="2.5" fill="#06b6d4" />
  </g>
</svg>
