<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" width="100%" height="100%">
  <defs>
    <!-- Brand Primary Gradient: Cobalt -> Indigo -> Cyan -->
    <linearGradient id="bodha-logo-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Brand Accent Gradient: Cyan -> Emerald -->
    <linearGradient id="bodha-logo-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="bodha-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="bodha-logo-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Group: Emblem Symbol (Scaled to 64x64 at x=8, y=8) -->
  <g transform="translate(8, 8) scale(0.64)" filter="url(#bodha-logo-shadow)">
    <!-- Base Architectural Pillar (Foundation Spine) -->
    <rect x="18" y="16" width="13" height="68" rx="6.5" fill="url(#bodha-logo-primary)" />

    <!-- Top Progression Tier (Milestone 1 / Prerequisite Baseline) -->
    <path
      d="M31 16 H 55 C 68.25 16 76 23.5 76 33.5 C 76 43 68.5 48.5 56 48.5 H 31 V 36 H 54 C 60 36 63.5 34.5 63.5 32 C 63.5 29.5 60 28 54 28 H 31 Z"
      fill="url(#bodha-logo-primary)"
    />

    <!-- Bottom Progression Tier (Milestone 2 / Mastery Roadmap) -->
    <path
      d="M31 46 H 58 C 72 46 82 52.5 82 64 C 82 75.5 72.5 84 57 84 H 31 V 71.5 H 56 C 63.5 71.5 68.5 69.5 68.5 65 C 68.5 60.5 63.5 58.5 56 58.5 H 31 Z"
      fill="url(#bodha-logo-primary)"
    />

    <!-- Intersecting Upward Progression Chevron / Dynamic Pathway Notch -->
    <path
      d="M48 48.5 L 58 38.5 L 67 48.5 L 57 58.5 Z"
      fill="url(#bodha-logo-accent)"
      opacity="0.95"
    />

    <!-- Intelligence Core / AI Nexus Spark Node -->
    <circle cx="57.5" cy="48.5" r="4.5" fill="#ffffff" />
    <circle cx="57.5" cy="48.5" r="2.5" fill="#06b6d4" />
  </g>

  <!-- Group: Typography Wordmark & Badge -->
  <g transform="translate(86, 0)">
    <!-- BODHA Title -->
    <text
      x="0"
      y="47"
      fill="url(#bodha-text-grad)"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-size="34"
      font-weight="900"
      letter-spacing="2.5"
    >BODHA</text>

    <!-- Tag Badge: AI PLATFORM -->
    <g transform="translate(154, 25)">
      <rect x="0" y="0" width="76" height="20" rx="6" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3" />
      <text
        x="38"
        y="14"
        fill="#22d3ee"
        font-family="'JetBrains Mono', monospace"
        font-size="9"
        font-weight="700"
        letter-spacing="1"
        text-anchor="middle"
      >AI ENGINE</text>
    </g>

    <!-- Subtitle / Architecture Descriptor -->
    <text
      x="1"
      y="67"
      fill="#94a3b8"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-size="10.5"
      font-weight="600"
      letter-spacing="0.5"
    >PERSONALIZED LEARNING PLATFORM</text>
  </g>
</svg>
