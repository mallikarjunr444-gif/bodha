server:
  port: 8080

spring:
  application:
    name: bodha-backend

  # DataSource & JPA configuration for PostgreSQL 16
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bodha_db}
    username: ${SPRING_DATASOURCE_USERNAME:${USER:mallanagouda}}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false


# Application specific metadata, CORS & AI Configuration
bodha:
  app:
    name: "BODHA API"
    version: "1.0.0"
    description: "AI-Powered Personalized Learning Platform Backend"

  # JWT Token Configuration (Module N)
  jwt:
    secret: ${JWT_SECRET:bodha-dev-secret-key-must-be-at-least-256-bits-long-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  # CORS: comma-separated list of allowed frontend origins.
  # Development default: http://localhost:5173
  # Production: set CORS_ALLOWED_ORIGINS=https://your-frontend-domain.com
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # Rate Limiting Configuration (Module O)
  security:
    rate-limiting:
      enabled: ${RATE_LIMITING_ENABLED:true}
      login-rpm: ${RATE_LIMIT_LOGIN_RPM:10}
      register-rpm: ${RATE_LIMIT_REGISTER_RPM:5}
      ai-rpm: ${RATE_LIMIT_AI_RPM:20}

  ai:
    provider: ${AI_PROVIDER:mock}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-1.5-flash}
    endpoint: ${AI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
    timeout-ms: ${AI_TIMEOUT_MS:5000}
